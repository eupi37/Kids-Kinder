workflows:
  cordova-android-build:
    name: Cordova Android Build
    max_build_duration: 60

    environment:
      node: 18

    scripts:
      - npm install -g cordova
      - cordova create myApp com.kidskinder.app "Kids Kinder"
      - cd myApp
      - rm -rf www
      - cp -r ../www ./www
      - cp ../config.xml .
      - cordova platform add android
      - cordova build android --release

    artifacts:
      - myApp/platforms/android/app/build/outputs/**/*.apk
      - myApp/platforms/android/app/build/outputs/**/*.aab
