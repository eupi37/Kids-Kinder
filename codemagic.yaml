workflows:
  cordova-android-build:
    name: Cordova Android Build
    max_build_duration: 60

    environment:
      node: 18
      vars:
        ORG_GRADLE_PROJECT_cdvBuildToolsVersion: 33.0.0
        ORG_GRADLE_PROJECT_cdvCompileSdkVersion: 33
        ORG_GRADLE_PROJECT_cdvTargetSdkVersion: 33

    scripts:
      - npm install -g cordova
      - cordova platform remove android || true
      - cordova platform add android@12.0.1

      # Build debug APK (installable)
      - cordova build android

      # Build Play Store AAB
      - cordova build android --release -- --packageType=bundle

    artifacts:
      - platforms/android/app/build/outputs/**/*.apk
      - platforms/android/app/build/outputs/**/*.aab
