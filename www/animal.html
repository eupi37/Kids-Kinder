      /* ===== GAME TOP BAR ===== */
.game-topbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 50px;
    background: #2e7d32;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 12px;
    box-sizing: border-box;
    z-index: 1000;
}
/*level*/
.top-level{
  position: absolute;
  left: 45px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
}
/* RIGHT (Coins) */
.top-right {
  position: absolute;

  right: 35px;
  top: 50%;
  
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  gap: 2px;
}
.coin-icon{
  width: 50px;
  height: 80px;
  vertical-align: middle;
}
.back-btn {
    font-size: 22px;
    cursor: pointer;
    margin-right: 12px;
}

.game-topbar .title {
    flex-grow: 1;
    font-size: 18px;
    font-weight: bold;
}

body {
    padding-top: 90px; /* IMPORTANT: space for top bar */
}

      .animal-box {

      }
      
      button {

          font-size: 17px;
          border-radius: 8px;
          border: none;
          background: #ffe0b2;
          cursor: pointer;
          display: block;
      }
      
      button:hover {

let index = 0;

function shuffle(array) {
  return array.sort(() => Math.random() - 0.5);
}

function loadQuestion() {
  const correctAnimal = animals[index];
  document.getElementById("animalEmoji").innerText = correctAnimal.emoji;

  let options = [correctAnimal.name];
  let others = animals.filter(a => a.name !== correctAnimal.name).map(a => a.name);
  shuffle(others);

  options.push(others[0], others[1], others[2]);
  shuffle(options);

  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  options.forEach(option => {
    const btn = document.createElement("button");

    btn.onclick = () => checkAnswer(option);

  });

}
